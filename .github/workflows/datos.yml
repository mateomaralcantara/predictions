name: Actualizar datos

on:
  schedule:
    - cron: "17 3 * * *" # diario 03:17 UTC (23:17 en RD), después de los sorteos nocturnos
  workflow_dispatch:
    inputs:
      rellenar_huecos:
        description: "Rellenar huecos del histórico tradicional (hasta 400 días por ejecución)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt

      - name: Loterías tradicionales
        run: |
          python apps/collector/tradicionales.py ${{ (github.event_name == 'schedule' || inputs.rellenar_huecos) && '--rellenar-huecos' || '' }} --max-dias 400

      - name: Loto LEIDSA
        continue-on-error: true
        run: python packages/games/loto/sync.py --csv data/loto/loto_historico.csv --append-latest

      - name: SuperKino
        continue-on-error: true
        run: python packages/games/superkino/sync.py --csv data/superkino/superkino_historico.csv --append-latest

      - name: Validar que la API sigue cargando los datos
        run: |
          pip install -q pytest
          python -m pytest -q tests/test_predictores.py tests/test_stats.py

      - name: Guardar cambios
        run: |
          if git diff --quiet -- data; then
            echo "Sin datos nuevos."
            exit 0
          fi
          git config user.name "predictions-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: actualización automática $(date -u +%F)"
          git push

      - name: Importar a PostgreSQL de producción
        if: env.DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        working-directory: apps/api
        run: python -m app.cli importar-csv
